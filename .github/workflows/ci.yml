name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - working-directory: backend
        run: |
          uv sync --group dev
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy app
          uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: web
        run: |
          npm ci
          npm run lint
          npm run test -- --run
