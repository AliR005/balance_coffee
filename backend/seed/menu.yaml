  - slug: cocoa
    category: decaf
    name: Какао
    description: Густое, шоколадное, без кофеина.
    base_price: 32000 # демо
    prep_units: 1
    tags: [no_caffeine]
    groups:
      - { key: size }
      - { key: milk, min_select: 1 }
