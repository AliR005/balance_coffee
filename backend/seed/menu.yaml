# Стоп-лист различается по точкам (для демо и тестов).
availability:
  - location: TV
    unavailable_products: [cold-brew]
    unavailable_options: ["Кокосовое"]
  - location: PT
    unavailable_products: []
    unavailable_options: ["Лесной орех"]
